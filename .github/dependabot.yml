# Keeps dependencies patched and consolidates update PRs.
# GitHub Pages builds the live site with its own github-pages gem; the Ruby
# gems here build it locally and in CI. The npm packages are build and test
# tooling only (Sass, esbuild, Playwright, Lighthouse CI).
version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    # Pinned to the versions GitHub Pages runs (see Gemfile).
    ignore:
      - dependency-name: "jekyll-sitemap"
      - dependency-name: "jekyll-feed"
      - dependency-name: "jekyll-seo-tag"
    groups:
      ruby:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      build-tooling:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
