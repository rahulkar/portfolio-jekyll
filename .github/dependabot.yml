# Keeps dependencies patched and consolidates update PRs.
# The Ruby gems build the live site: CI builds it with them, tests it and
# deploys it to GitHub Pages. The npm packages are build and test tooling only
# (Sass, esbuild, Playwright, Lighthouse CI).
version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ruby:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      build-tooling:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
