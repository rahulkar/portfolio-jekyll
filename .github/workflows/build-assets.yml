name: Verify site

# Two guards: (1) the committed CSS/JS bundles match src/ and the markup is
# CSP-clean; (2) the built site validates, has no broken links, and passes
# Playwright + axe checks at phone and desktop widths plus Lighthouse CI
# thresholds. Screenshots and reports are kept as artifacts for a human look.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  assets:
    name: Built assets and CSP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check:csp

      - name: Check built assets match source
        run: |
          if ! git diff --quiet -- assets/css/main.css assets/js/main.js; then
            echo "::error::Built assets are out of date. Run 'npm run build' and commit assets/css/main.css and assets/js/main.js."
            git --no-pager diff --stat -- assets/css/main.css assets/js/main.js
            exit 1
          fi
          echo "Built assets are in sync with source."

  site:
    name: Validate, links, Playwright, axe and Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Validate HTML
        run: npm run validate:html

      - run: npx playwright install --with-deps chromium

      - name: Playwright + axe
        run: npx playwright test
        env:
          CI: "1"

      - name: Lighthouse CI
        run: npx lhci autorun

      # Runs last so the Playwright and Lighthouse reports exist even when a link is
      # broken. Absolute www.rahulkar.com links (canonical, og:url, the feed) are remapped
      # to the build output: the live site may not have deployed this commit yet.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --exclude 'linkedin\.com'
            --root-dir "${{ github.workspace }}/_site" --index-files index.html
            --remap 'https://www\.rahulkar\.com(/.*)? file://${{ github.workspace }}/_site${1}'
            './_site/**/*.html'
          fail: true

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-checks
          path: |
            test-results/**/*.png
            test-results/**/*.pdf
            playwright-report/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
