  hue: earth
- label: Crypto
  icon: bitcoin
  hue: saturn
- label: Marketing
  icon: megaphone
  hue: neptune
- label: Electronics
  icon: circuit-board
  hue: mars
- label: Space
  icon: orbit
  hue: uranus
