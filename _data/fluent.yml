# The six words in "I speak fluent geek, silicon, crypto, marketing,
# electronics, and space stuff." (About, home page), each with an icon from
# _includes/icon.html. Rahul's own sentence: keep the words and their order.
# `hue` is one of the orbit's planet colours (the --hue-* tokens); warm and
# cool alternate so neighbours stay apart.
- label: Geek
