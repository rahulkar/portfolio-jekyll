# Site settings
title: Rahul Kar
tagline: Enterprise Solution Architect & Technology Lead
description: "Rahul Kar, Enterprise Solution Architect & Technology Lead in Kolkata, India. 11+ years, from quality engineering and automation to platforms, cloud and agentic AI."
# baseurl: "/particle" # the subpath of your site, e.g. /blog
url: "https://www.rahulkar.com"
lang: en-GB

# Social sharing (jekyll-seo-tag). The OG/Twitter image is applied to every page
# via `defaults` below, because seo-tag reads page.image (not site.image). The
# Person schema is provided by the richer custom JSON-LD in _includes/head.html,
# so author/twitter/social are intentionally omitted to avoid duplicate schema
# and bogus empty Twitter handles.

# User settings
username: Rahul Kar
user_description: "Enterprise solution architect in Kolkata, India. 11+ years, from quality engineering and automation to platforms, cloud and agentic AI."
user_title: Enterprise Solution Architect & Technology Lead
email: kar.rahul@pm.me
github_username: rahulkar
linkedin_url: "https://www.linkedin.com/in/karrahul/"
linkedin_handle: "in/karrahul"
credly_url: "https://www.credly.com/users/rahul-kar"
credly_handle: "rahul-kar"

# Working hours drawn on the Kolkata datum (whole hours, IST).
working_hours:
  from: 10
  to: 19

# Notes: short pieces, one markdown file each under _notes/.
collections:
  notes:
    output: true
    permalink: /notes/:name/

# /feed.xml is the hand-written notes feed in the repo root (jekyll-feed skips
# paths that already exist); the plugin's (empty) posts feed moves aside.
feed:
  path: /feed/posts.xml

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Default OG/Twitter share image for every page (consumed by jekyll-seo-tag)
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      author: Rahul Kar
  - scope:
      path: "redirects"
    values:
      layout: redirect
      sitemap: false
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-v3.png
        width: 1200
        height: 630
        alt: "Rahul Kar, Enterprise Solution Architect & Technology Lead, Kolkata"

include: ['.well-known']
exclude: ['package.json', 'package-lock.json', 'src', 'node_modules', 'rahul', 'tools', 'tests', 'playwright.config.js', 'lighthouserc.json', 'test-results', 'playwright-report', 'LOCAL_SETUP.md', 'LICENSE.txt', '*.heic']
