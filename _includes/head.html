<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F8F3E7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C2522" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self' static.cloudflareinsights.com; connect-src 'self' cloudflareinsights.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  {% seo %}{% if page.noindex %}
  <meta name="robots" content="noindex">{% endif %}
  <link type="application/atom+xml" rel="alternate" href="{{ "/feed.xml" | absolute_url }}" title="{{ site.title }} | Scribbles">

  <link rel="preload" as="font" type="font/woff2" href="{{ "/assets/fonts/excalifont.woff2" | prepend: site.baseurl }}" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="{{ "/assets/fonts/nunito.woff2" | prepend: site.baseurl }}" crossorigin>
  <link rel="stylesheet" href="{{ "/assets/css/main.css" | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}">
  <noscript><link rel="stylesheet" href="{{ "/assets/css/nojs.css" | prepend: site.baseurl }}"></noscript>
  <script src="{{ "/assets/js/theme.js" | prepend: site.baseurl }}?v={{ site.time | date: '%s' }}"></script>
  <link rel="icon" type="image/svg+xml" href="{{ "/assets/icons/favicon-v2.svg" | prepend: site.baseurl }}">
  <link rel="shortcut icon" type="image/x-icon" href="{{ "/assets/favicon-v2.ico" | prepend: site.baseurl }}">
  <link rel="apple-touch-icon" href="{{ "/assets/icons/apple-touch-icon-v2.png" | prepend: site.baseurl }}">

  <!-- Structured data: a ProfilePage whose main entity is the Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ProfilePage",
    "url": {{ site.url | jsonify }},
    "mainEntity": {
      "@type": "Person",
      "name": {{ site.username | jsonify }},
      "url": {{ site.url | jsonify }},
      "jobTitle": {{ site.user_title | jsonify }},
      "description": {{ site.user_description | jsonify }},
      "email": {{ site.email | jsonify }},
      "address": { "@type": "PostalAddress", "addressLocality": "Kolkata", "addressCountry": "IN" },
      "knowsAbout": [{% for group in site.data.stack %}{% for item in group.items %}{{ item.label | jsonify }}{% unless forloop.last and forloop.parentloop.last %}, {% endunless %}{% endfor %}{% endfor %}]{% assign social_profiles = '' %}{% if site.github_username %}{% assign social_profiles = social_profiles | append: '"https://github.com/' | append: site.github_username | append: '"' %}{% endif %}{% if site.linkedin_url %}{% if social_profiles != '' %}{% assign social_profiles = social_profiles | append: ',' %}{% endif %}{% assign social_profiles = social_profiles | append: '"' | append: site.linkedin_url | append: '"' %}{% endif %}{% if site.credly_url %}{% if social_profiles != '' %}{% assign social_profiles = social_profiles | append: ',' %}{% endif %}{% assign social_profiles = social_profiles | append: '"' | append: site.credly_url | append: '"' %}{% endif %}{% if social_profiles != '' %},
      "sameAs": [{{ social_profiles }}]{% endif %}
    }
  }
  </script>
</head>
