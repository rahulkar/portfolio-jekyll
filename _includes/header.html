<header class="hero" id="top">
  <div class="hero__doodle hero__doodle--circuit" aria-hidden="true">
    <svg class="doodle doodle--auto" viewBox="0 0 320 280" focusable="false"><use href="#d-circuit"></use></svg>
  </div>

  <div class="hero__annos" aria-hidden="true">
    <span class="anno">+ sketchbook &middot; vol. 11</span>
    <span class="anno">+ build 2026.10</span>
  </div>

  <div class="wrap hero__inner">
    <div class="hero__grid">
      <div>
        <h1 class="hero__heading reveal reveal--d1">
          <span class="hero__hello">hello, I'm</span>
          <span class="hl" data-sketch="highlight" data-seed="hero-name"><span class="sr-only">rahul</span>{% include name-paths.html %}</span>
          <span class="hero__role">engineer &amp; tinkerer<span class="caret"></span></span>
        </h1>

        <p class="hero__sub reveal reveal--d2">
          <span class="hero__sub-lead">Solution Architect &middot; <span class="hl--static">11+ years</span>.</span>
          <span class="hero__sub-rest">I ship enterprise platforms &mdash; tooling, cloud, DevOps, and agentic AI.</span>
        </p>

        <div class="hero__cta reveal reveal--d3">
          <a href="#stack" class="btn btn--primary" data-sketch="rect-fill" data-seed="cta-stack" data-scroll>
            <span>the stack</span>
            <svg class="doodle" aria-hidden="true" focusable="false"><use href="#d-arrow"></use></svg>
          </a>
          <a href="#connect" class="btn" data-sketch="rect" data-seed="cta-connect" data-scroll>
            <span>connect</span>
          </a>
        </div>
      </div>

      <figure class="desk reveal reveal--d2">
        <svg class="desk__scene" viewBox="0 0 520 300" aria-hidden="true" focusable="false">
          <use class="desk__item desk__item--desk" href="#d-desk" x="0" y="196" width="520" height="130"></use>
          <use class="desk__item desk__item--monitor" href="#d-monitor" x="70" y="52" width="200" height="153"></use>
          <use class="desk__item desk__item--bonsai" href="#d-bonsai" x="332" y="97" width="180" height="120"></use>
          <use class="desk__item desk__item--mug" href="#d-mug" x="272" y="153" width="56" height="52"></use>
          <use class="desk__item desk__item--chip" href="#d-chip" x="8" y="160" width="64" height="45"></use>
          <text class="desk__note" x="80" y="40">a PoC in progress</text>
          <text class="desk__note" x="376" y="86">bonsai</text>
          <text class="desk__note" x="270" y="142">coffee</text>
          <text class="desk__note" x="14" y="242">6502 &middot; retro computing</text>
        </svg>
        <figcaption class="sr-only">A doodle of my desk: a monitor with a proof-of-concept in progress, a bonsai, coffee and a 6502 chip.</figcaption>
      </figure>
    </div>
  </div>
</header>
