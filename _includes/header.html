<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="site-header__name" href="{{ "/" | relative_url }}">Rahul Kar</a>
    <nav class="site-nav" aria-label="Primary">
      <ul role="list">
        <li><a href="{{ "/how-i-work/" | relative_url }}"{% if page.url == "/how-i-work/" %} aria-current="page"{% endif %}>How I work</a></li>
        <li><a href="{{ "/notes/" | relative_url }}"{% if page.url == "/notes/" %} aria-current="page"{% elsif page.collection == "notes" %} aria-current="true"{% endif %}>Notes</a></li>
        <li><a href="{{ "/#about" | relative_url }}">About</a></li>
        <li><a href="{{ "/#contact" | relative_url }}">Contact</a></li>
      </ul>
    </nav>
    <button class="cmdk-trigger" id="cmdk-btn" type="button" aria-haspopup="dialog" aria-label="Command menu" hidden>{% include icon.html name="search" %}<kbd class="cmdk-trigger__keys" data-cmdk-keys>Ctrl K</kbd></button>
    <button class="theme-toggle" id="theme-btn" type="button" aria-pressed="false" aria-label="Dark theme" hidden>{% include icon.html name="theme" %}</button>
  </div>
</header>
