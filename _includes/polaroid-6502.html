{% comment %}The 6502 breadboard photo as a taped-in polaroid with a lightbox. Pass id via include.id so two pages can use it.{% endcomment %}
{% assign box_id = include.id | default: "sbc-lightbox" %}
<figure class="polaroid taped {{ include.class }}">
  <a class="polaroid__open" href="{{ "/assets/img/6502-1280.jpg" | prepend: site.baseurl }}" data-lightbox="{{ box_id }}">
    <picture>
      <source type="image/webp" srcset="{{ "/assets/img/6502-640.webp" | prepend: site.baseurl }} 640w, {{ "/assets/img/6502-1280.webp" | prepend: site.baseurl }} 1280w" sizes="(max-width: 760px) calc(100vw - 48px), 320px">
      <img src="{{ "/assets/img/6502-640.jpg" | prepend: site.baseurl }}" srcset="{{ "/assets/img/6502-640.jpg" | prepend: site.baseurl }} 640w, {{ "/assets/img/6502-1280.jpg" | prepend: site.baseurl }} 1280w" sizes="(max-width: 760px) calc(100vw - 48px), 320px" width="640" height="419" alt="A 6502 computer built on two breadboards: a W65C02 CPU, EEPROM and RAM chips wired with blue and yellow jumpers, and a green LCD reading 6502 SBC www.rahulkar.com" loading="lazy" decoding="async">
    </picture>
    <span class="sr-only">(open a larger view)</span>
  </a>
  <figcaption class="polaroid__caption">{{ include.caption | default: "the 6502 breadboard build &middot; it even knows the address" }}</figcaption>
</figure>

<dialog class="lightbox" id="{{ box_id }}" aria-label="The 6502 breadboard computer, larger view">
  <button class="lightbox__close" type="button" aria-label="Close">
    <svg class="doodle" aria-hidden="true" focusable="false"><use href="#d-x"></use></svg>
  </button>
  <picture>
    <source type="image/webp" srcset="{{ "/assets/img/6502-1280.webp" | prepend: site.baseurl }}">
    <img src="{{ "/assets/img/6502-1280.jpg" | prepend: site.baseurl }}" width="1280" height="838" alt="A 6502 computer built on two breadboards: a W65C02 CPU, EEPROM and RAM chips wired with blue and yellow jumpers, and a green LCD reading 6502 SBC www.rahulkar.com" loading="lazy" decoding="async">
  </picture>
  <p class="lightbox__caption">W65C02 CPU, EEPROM, RAM, a 74HC00, a crystal and a 1602 LCD &mdash; all on breadboards.</p>
</dialog>
